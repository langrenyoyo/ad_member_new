services:
  postgres:
    image: postgres:16-alpine
    container_name: ad-member-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ad_member}
      POSTGRES_USER: ${POSTGRES_USER:-ad_member}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ad_member_dev}
    ports:
      - "5432:5432"
    volumes:
      - ad_member_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ad-member-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ad_member:ad_member_dev@postgres:5432/ad_member}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      TAKU_SEC_KEY: ${TAKU_SEC_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      ALIBABA_CLOUD_SECURITY_TOKEN: ${ALIBABA_CLOUD_SECURITY_TOKEN:-}
      ALIYUN_RISK_REGION: ${ALIYUN_RISK_REGION:-cn-shanghai}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      ALIPAY_ENV: ${ALIPAY_ENV:-sandbox}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY_PATH: ${ALIPAY_PRIVATE_KEY_PATH:-}
      ALIPAY_PUBLIC_KEY_PATH: ${ALIPAY_PUBLIC_KEY_PATH:-}
      ALIPAY_TIMEOUT: ${ALIPAY_TIMEOUT:-10}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
    ports:
      - "8000:8000"

volumes:
  ad_member_postgres_data:
