services:
  postgres:
    image: postgres:16-alpine
    container_name: ad-member-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ad_member}
      POSTGRES_USER: ${POSTGRES_USER:-ad_member}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ad_member_dev}
    ports:
      - "5432:5432"
    volumes:
      - ad_member_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ad-member-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ad_member:ad_member_dev@postgres:5432/ad_member}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    ports:
      - "8000:8000"

volumes:
  ad_member_postgres_data:
